<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Картка товару</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <article class="card">
        <div class="hero">
          <div class="hero-image" role="img" aria-label="Набір друкованих фотографій на дерев'яному столі"></div>
          <div class="hero-overlay">
            <h1 class="title">Набір фотокарток</h1>
            <p class="subtitle">Яскраві друковані фотокартки для сімейних спогадів</p>
            <p class="price">2 499 <span class="currency">грн</span></p>
          </div>
        </div>

        <div class="features" role="group" aria-label="Переваги товару">
          <ul class="feat-list">
            <li class="feat-item" aria-label="Безкоштовна доставка">
              <span class="fa-solid fa-truck" aria-hidden="true"></span>
              <span>Безкоштовна доставка</span>
            </li>

            <li class="feat-item" aria-label="Гарантія 12 місяців">
              <span class="fa-solid fa-shield" aria-hidden="true"></span>
              <span>Гарантія 12 місяців</span>
            </li>

            <li class="feat-item" aria-label="Легке повернення">
              <span class="fa-solid fa-rotate-left" aria-hidden="true"></span>
              <span>Легке повернення</span>
            </li>
          </ul>
        </div>
      </article>
    </main>
  </body>
</html>
