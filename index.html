<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Картка товару</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <article class="card">
        <figure class="hero">
          <div class="hero-image" role="img" aria-label="Набір друкованих фотографій на дерев'яному столі"></div>
          <figcaption class="hero-overlay">
            <h1 class="title">Набір фотокарток</h1>
            <p class="subtitle">Яскраві друковані фотокартки для сімейних спогадів</p>
            <p class="price">2 499 <span class="currency">грн</span></p>
          </figcaption>
        </figure>

        <div class="features" role="group" aria-label="Переваги товару">
          <ul class="feat-list">
            <li class="feat-item">
              <!-- Truck SVG -->
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 7h11v7H3z" stroke="#2f8f3b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14 7h3l3 3v4" stroke="#2f8f3b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="7.5" cy="17.5" r="1.5" fill="#2f8f3b"/>
                <circle cx="18.5" cy="17.5" r="1.5" fill="#2f8f3b"/>
              </svg>
              <span>Безкоштовна доставка</span>
            </li>

            <li class="feat-item">
              <!-- Shield SVG -->
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2l7 3v5c0 5-3.5 9-7 9s-7-4-7-9V5l7-3z" stroke="#2f8f3b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9.5 11.5l1.8 1.8L15 9" stroke="#2f8f3b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Гарантія 12 місяців</span>
            </li>

            <li class="feat-item">
              <!-- Return SVG -->
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 7v6h-6" stroke="#2f8f3b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3 17a9 9 0 0113.5-7" stroke="#2f8f3b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Легке повернення</span>
            </li>
          </ul>
        </div>
      </article>
    </main>
  </body>
</html>
