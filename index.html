<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Картка предмета</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="item-card item-card--legendary">
    <img
      class="item-card__image"
      src="./ядро.jfif"
      alt="Космічний артефакт"
    >

    <div class="item-card__content">
      <h2 class="item-card__title">Ядро Зоряного Порталу</h2>

      <p class="item-card__type">
        Тип: Космічний артефакт
      </p>

      <p class="item-card__description">
        Стародавній пристрій, здатний відкривати портали
        між віддаленими планетами та зоряними системами.
      </p>

      <p class="item-card__rarity">
        Рідкісність: Легендарний
      </p>

      <div class="item-card__bottom">
        <span class="item-card__price">12 500 золота</span>
        <button class="item-card__button">Придбати</button>
      </div>
    </div>
  </div>

</body>
</html>
